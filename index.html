<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#202124">
  <title>Живой Блокнот — Keep Style</title>
  
  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK (App, Firestore и Cloud Storage для картинок, аудио и архивов) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- Верхняя панель (Google Keep Style) -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
        </svg>
      </div>
      <h1 class="brand-name">Заметки</h1>
    </div>

    <!-- Поисковая строка -->
    <div class="search-bar">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Поиск в заметках..." autocomplete="off">
    </div>

    <div class="header-right">
      <!-- Индикатор синхронизации -->
      <div id="status-pill" class="status-pill status-connecting" title="Статус базы данных">
        <span class="status-dot"></span>
        <span id="status-text">Синхронизация...</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Поле ввода заметки (Раскрывающееся Google Keep Style) -->
    <div class="note-creator-wrapper">
      <form id="note-creator" class="note-creator" autocomplete="off">
        
        <!-- Заголовок (виден в раскрытом виде) -->
        <input 
          type="text" 
          id="creator-title" 
          class="creator-title hidden" 
          placeholder="Заголовок" 
          maxlength="120"
        >

        <!-- Текст заметки -->
        <textarea 
          id="creator-text" 
          class="creator-text" 
          placeholder="Заметка..." 
          rows="1"
          required
        ></textarea>

        <!-- Предпросмотр прикреплённого вложения -->
        <div id="attachment-preview-box" class="attachment-preview-box hidden">
          <!-- Картинка -->
          <div id="preview-image-wrap" class="preview-item hidden">
            <img id="preview-image" alt="Предпросмотр картинки">
            <button type="button" class="btn-remove-attachment" id="btn-remove-attachment" title="Удалить файл">&times;</button>
          </div>
          <!-- Аудио -->
          <div id="preview-audio-wrap" class="preview-item hidden">
            <audio id="preview-audio" controls></audio>
            <button type="button" class="btn-remove-attachment" id="btn-remove-audio" title="Удалить аудио">&times;</button>
          </div>
          <!-- Документ / Архив -->
          <div id="preview-file-wrap" class="preview-item preview-file-chip hidden">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <div class="file-desc">
              <span id="preview-file-name" class="name">archive.zip</span>
              <span id="preview-file-size" class="size">0 MB</span>
            </div>
            <button type="button" class="btn-remove-attachment" id="btn-remove-file" title="Удалить файл">&times;</button>
          </div>
        </div>

        <!-- Полоса прогресса загрузки в облако -->
        <div id="upload-progress-bar" class="upload-progress-bar hidden">
          <div id="upload-progress-fill" class="upload-progress-fill"></div>
        </div>

        <!-- Нижняя панель действий создания заметки -->
        <div id="creator-actions" class="creator-actions hidden">
          <div class="action-tools">
            <!-- Кнопка картинки -->
            <label class="tool-btn" title="Прикрепить изображение">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <input type="file" id="input-image" accept="image/*" class="file-input-hidden">
            </label>

            <!-- Кнопка аудио -->
            <label class="tool-btn" title="Прикрепить аудиофайл (mp3, wav)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
              <input type="file" id="input-audio" accept="audio/*" class="file-input-hidden">
            </label>

            <!-- Кнопка файла / архива -->
            <label class="tool-btn" title="Прикрепить архив или документ (zip, rar, pdf, doc)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
              <input type="file" id="input-file" class="file-input-hidden">
            </label>
          </div>

          <div class="action-buttons">
            <button type="submit" id="btn-save-note" class="btn-primary">Сохранить</button>
            <button type="button" id="btn-close-creator" class="btn-text">Закрыть</button>
          </div>
        </div>

      </form>
    </div>

    <!-- Информационная строка счетчиков -->
    <div class="feed-header">
      <span id="counter-summary" class="counter-summary">Загрузка заметок...</span>
      <div class="filter-chips">
        <button type="button" class="filter-chip active" data-filter="all">Все</button>
        <button type="button" class="filter-chip" data-filter="active">В процессе</button>
        <button type="button" class="filter-chip" data-filter="media">С файлами</button>
      </div>
    </div>

    <!-- Сетка заметок (Google Keep Masonry Grid) -->
    <div id="notes-grid" class="notes-grid"></div>

    <!-- Состояние пустого списка -->
    <div id="empty-state" class="empty-state hidden">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12"></line>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <p class="empty-title">Здесь пока пусто</p>
      <p class="empty-subtitle">Нажмите выше, чтобы создать заметку, прикрепить архив, аудио или картинку</p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
